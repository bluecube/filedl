[package]
name = "filedl"
description = "A simple web app for public file downloads."
repository = "https://github.com/bluecube/filedl"
version = "0.9.4"
edition = "2024"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
actix-files = "0.6.10"
actix-web = "4.12.1"
assert2 = "0.3.18"
chrono = { version = "0.4.43", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.5.58", features = ["derive"] }
env_logger = "0.11.9"
fast_image_resize = { version = "6.0.0", features = ["image"] }
feruca = "0.11.5"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.32"
hayro = "0.5.0"
horrorshow = "0.8.9"
humansize = "2.1.3"
image = { version = "0.25.9", features = ["avif"] }
kamadak-exif = "0.6.1"
log = "0.4.29"
memchr = "2.8.0"
mime = "0.3.17"
percent-encoding = "2.3.2"
quick_cache = { version = "0.6.18", features = ["stats"] }
rand = { version = "0.10.0", features = ["thread_rng"] }
relative-path = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tempfile = "3.25.0"
snafu = "0.9"
tokio = { version = "1.49.0", features = ["sync", "fs", "macros"] }
tokio-rayon = "2.1.0"
zippity = { version = "0.5.0", features = ["actix-web", "chrono"] }

[dev-dependencies]
proptest = "1.10.0"
test-strategy = "0.4.5"
zip = "8.2.0"

[build-dependencies]
anyhow = "1.0.101"
brotli = "8.0.2"
css-minify = "0.5.2"
grass = "0.13.4"
oxc = { version = "0.115.0", default-features=false, features = ["codegen", "minifier"] }
walkdir = "2.5.0"
