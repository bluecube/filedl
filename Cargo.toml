[package]
name = "filedl"
description = "A simple web app for public file downloads."
repository = "https://github.com/bluecube/filedl"
version = "0.8.0"
edition = "2024"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
actix-files = "0.6.10"
actix-web = "4.12.1"
assert2 = "0.3.18"
chrono = { version = "0.4.43", features = ["serde"] }
chrono-tz = { version = "0.8.6", features = ["serde"] }
clap = { version = "4.5.58", features = ["derive"] }
env_logger = "0.10.2"
fast_image_resize = "2.7.3"
feruca = "0.9.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.32"
hayro = "0.5.0"
horrorshow = "0.8.9"
humansize = "2.1.3"
image = { version = "0.25.9", features = ["avif"] }
kamadak-exif = "0.5.5"
log = "0.4.29"
memchr = "2.8.0"
mime = "0.3.17"
percent-encoding = "2.3.2"
quick_cache = { version = "0.6.18", features = ["stats"] }
rand = "0.8.5"
relative-path = { version = "1.9.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tempfile = "3.25.0"
thiserror = "1.0.69"
tokio = { version = "1.49.0", features = ["sync", "fs"] }
tokio-rayon = "2.1.0"
zippity = { version = "0.5.0", features = ["actix-web", "chrono"] }
# zippity = { path = "/home/ube/development/rust/zippity", features = ["actix-web", "chrono"] }

[dev-dependencies]
proptest = "1.10.0"
test-strategy = "0.3.1"

[build-dependencies]
anyhow = "1.0.101"
brotli = "6.0.0"
css-minify = "0.5.2"
grass = "0.13.4"
minify-js = { git = "https://github.com/RuairidhWilliamson/minify-js.git", rev = "8637df1" }
walkdir = "2.5.0"
