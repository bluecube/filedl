[package]
name = "filedl"
description = "A simple web app for public file downloads."
repository = "https://github.com/bluecube/filedl"
version = "0.11.0"
edition = "2024"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
actix-files = "0.7.3"
actix-web = "4.18.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
fast_image_resize = { version = "6.1.0", features = ["image"] }
feruca = "0.13.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.34"
hayro = "0.9.0"
horrorshow = "0.8.9"
humansize = "2.1.3"
image = { version = "0.25.10", features = ["avif"] }
kamadak-exif = "0.6.1"
log = "0.4.35"
memchr = "2.8.3"
mime = "0.3.17"
percent-encoding = "2.3.2"
quick_cache = { version = "0.7.0", features = ["stats"] }
rand = { version = "0.10.3", features = ["thread_rng"] }
relative-path = { version = "2.0.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
snafu = "0.9"
tokio = { version = "1.54.1", features = ["sync", "fs", "macros", "rt", "time"] }
tokio-rayon = "2.1.0"
zippity = { version = "0.5.0", features = ["actix-web", "chrono"] }
atomic-write-file = { version = "0.3.1", features = ["unnamed-tmpfile"] }

[dev-dependencies]
assert2 = "0.4.1"
proptest = "1.12.0"
test-case = "3.4.1"
test-strategy = "0.4.5"
tokio = { version = "1.54.1", features = ["test-util"] }
zip = "9.3.0"

[build-dependencies]
anyhow = "1.0.104"
brotli = "9.1.1"
css-minify = "0.5.2"
grass = "0.13.4"
oxc = { version = "0.157.0", default-features=false, features = ["codegen", "minifier"] }
walkdir = "2.5.0"
